<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ボーダレスジャパン プロジェクト管理</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;background:#f0f2f5;color:#1a1a2e;min-height:100vh}
header{background:#1a1a2e;position:sticky;top:0;z-index:200;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.header-inner{display:flex;align-items:center;gap:16px;max-width:1280px;margin:0 auto;height:54px;padding:0 20px}
header h1{font-size:14px;font-weight:700;color:#fff;white-space:nowrap}
.tab-nav{display:flex;overflow-x:auto}
.tab-btn{padding:0 14px;height:54px;border:none;background:transparent;color:rgba(255,255,255,.55);font-size:13px;font-family:inherit;cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;font-weight:500;white-space:nowrap}
.tab-btn:hover{color:rgba(255,255,255,.9)}
.tab-btn.active{color:#fff;border-bottom-color:#7eb8f7}
.tab-content{display:none}
.tab-content.active{display:block}
.page{max-width:1200px;margin:0 auto;padding:24px 16px}

/* Dashboard */
.dash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
.org-summary-card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 1px 6px rgba(0,0,0,.08);border-top:4px solid #ccc;cursor:pointer;transition:box-shadow .2s,transform .1s}
.org-summary-card:hover{box-shadow:0 4px 18px rgba(0,0,0,.12);transform:translateY(-2px)}
.osc-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.osc-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.osc-name{font-size:13px;font-weight:700;line-height:1.3}
.osc-obj-count{font-size:11px;color:#888;margin-top:1px}
.osc-rate{font-size:28px;font-weight:800;line-height:1;margin-bottom:6px}
.osc-bar{height:6px;background:#f0f0f0;border-radius:3px;overflow:hidden;margin-bottom:8px}
.osc-fill{height:100%;border-radius:3px;transition:width .6s}
.osc-krs{font-size:11px;color:#888}

.dash-section{margin-bottom:28px}
.section-title{font-size:16px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.section-title span{font-size:12px;font-weight:500;color:#888}
.proj-cards-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.mini-proj-card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.07);border-left:4px solid #ccc}
.mpc-name{font-size:14px;font-weight:700;margin-bottom:4px}
.mpc-meta{font-size:12px;color:#888;margin-bottom:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mpc-prog{height:5px;background:#f0f0f0;border-radius:3px;overflow:hidden}
.mpc-prog-fill{height:100%;border-radius:3px;background:#3b82f6}

.task-quick-list{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.tq-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f5f5f5;font-size:13px}
.tq-item:last-child{border-bottom:none}
.tq-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tq-title{flex:1;font-weight:500}
.tq-due{font-size:11px;color:#888;white-space:nowrap}
.tq-ov{color:#dc2626!important;font-weight:600}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
.stat-card{background:#fff;border-radius:12px;padding:16px 20px;box-shadow:0 1px 4px rgba(0,0,0,.07);text-align:center}
.stat-num{font-size:26px;font-weight:800;line-height:1;margin-bottom:4px}
.stat-lbl{font-size:11px;color:#888}
.n-total{color:#1a1a2e}.n-active{color:#3b82f6}.n-warn{color:#f59e0b}.n-done{color:#22c55e}

/* OKR Tab */
.okr-org-tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.okr-org-btn{padding:8px 18px;border-radius:24px;border:2px solid #e0e0e0;background:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}
.okr-org-btn:hover{border-color:#4a90e2;color:#4a90e2}
.okr-org-btn.active{color:#fff;border-color:transparent}
.okr-accordion{display:flex;flex-direction:column;gap:14px}
.obj-card{background:#fff;border-radius:14px;box-shadow:0 1px 6px rgba(0,0,0,.08);overflow:hidden}
.obj-head{display:flex;align-items:center;gap:12px;padding:16px 20px;cursor:pointer;user-select:none}
.obj-head:hover{background:#fafafa}
.obj-num{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.obj-name{flex:1;font-size:15px;font-weight:700}
.obj-desc{font-size:12px;color:#888;margin-top:2px;line-height:1.5}
.obj-chevron{font-size:12px;color:#999;transition:transform .2s;flex-shrink:0}
.obj-card.open .obj-chevron{transform:rotate(90deg)}
.obj-body{border-top:1px solid #f0f0f0;display:none}
.obj-card.open .obj-body{display:block}
.kr-list{padding:8px 20px 16px}
.kr-item{display:grid;grid-template-columns:1fr 140px 140px 120px 60px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #f5f5f5}
.kr-item:last-child{border-bottom:none}
.kr-name{font-size:13px;font-weight:600;line-height:1.4}
.kr-target{font-size:12px;color:#666;text-align:right}
.kr-actual-wrap{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.kr-actual-input{width:90px;padding:5px 8px;border:1.5px solid #e0e0e0;border-radius:6px;font-size:13px;text-align:right;font-family:inherit;outline:none;transition:border-color .2s}
.kr-actual-input:focus{border-color:#4a90e2}
.kr-unit{font-size:11px;color:#888}
.kr-bar-wrap{display:flex;flex-direction:column;gap:3px}
.kr-bar{height:6px;background:#f0f0f0;border-radius:3px;overflow:hidden}
.kr-bar-fill{height:100%;border-radius:3px;transition:width .5s}
.kr-rate{font-size:12px;font-weight:700;text-align:right}
.kr-header{display:grid;grid-template-columns:1fr 140px 140px 120px 60px;gap:8px;padding:8px 0 6px;border-bottom:2px solid #f0f0f0;font-size:11px;color:#888;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.kr-header>*:nth-child(2),.kr-header>*:nth-child(3),.kr-header>*:nth-child(4),.kr-header>*:nth-child(5){text-align:right}
.obj-projs{padding:0 20px 14px;display:flex;gap:8px;flex-wrap:wrap}
.obj-proj-badge{padding:4px 12px;border-radius:14px;font-size:12px;font-weight:600;background:#f0f2f5;color:#444;display:flex;align-items:center;gap:4px}

/* Projects Tab */
.summary-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.summary-item{background:#fff;border-radius:12px;padding:16px 20px;box-shadow:0 1px 4px rgba(0,0,0,.07);text-align:center}
.summary-item .num{font-size:26px;font-weight:700;line-height:1;margin-bottom:6px}
.summary-item .lbl{font-size:12px;color:#888}
.project-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-bottom:20px}
.proj-card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.08);border-top:4px solid #94a3b8;transition:box-shadow .2s,transform .1s}
.proj-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1);transform:translateY(-1px)}
.proj-card.s-active{border-top-color:#3b82f6}.proj-card.s-warning{border-top-color:#f59e0b}
.proj-card.s-delayed{border-top-color:#ef4444}.proj-card.s-completed{border-top-color:#22c55e;opacity:.78}
.proj-card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.proj-name{font-size:15px;font-weight:700;line-height:1.3}
.proj-org-lbl{font-size:11px;padding:2px 8px;border-radius:10px;color:#fff;font-weight:600;display:inline-block;margin-top:3px}
.proj-acts{display:flex;gap:4px;flex-shrink:0}
.btn-icon{border:none;background:#f5f5f5;border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:background .15s}
.btn-icon:hover{background:#e0e0e0}
.proj-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center;margin-top:8px}
.sbadge{font-size:11px;padding:2px 10px;border-radius:10px;font-weight:600}
.sbadge.s-active{background:#dbeafe;color:#1d4ed8}.sbadge.s-warning{background:#fef3c7;color:#b45309}
.sbadge.s-delayed{background:#fee2e2;color:#b91c1c}.sbadge.s-completed{background:#dcfce7;color:#15803d}
.date-range{font-size:11px;color:#888}
.prog-wrap{margin-bottom:10px}
.prog-label{display:flex;justify-content:space-between;font-size:12px;color:#666;margin-bottom:4px}
.prog-bar{height:6px;background:#f0f0f0;border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;background:#3b82f6;transition:width .4s}
.s-warning .prog-fill{background:#f59e0b}.s-delayed .prog-fill{background:#ef4444}.s-completed .prog-fill{background:#22c55e}
.ms-list-view{border-top:1px solid #f5f5f5;padding-top:8px;margin-top:6px}
.ms-item{display:flex;align-items:center;gap:6px;font-size:12px;color:#666;padding:3px 0}
.ms-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ms-done-c .ms-dot{background:#22c55e}.ms-up .ms-dot{background:#3b82f6}.ms-late .ms-dot{background:#ef4444}
.ms-done-c .ms-n{text-decoration:line-through;color:#aaa}.ms-late .ms-n{color:#ef4444}
.ms-d{margin-left:auto;font-size:11px;color:#bbb}
.proj-krs-wrap{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.kr-link-badge{font-size:11px;padding:3px 10px;border-radius:10px;font-weight:600}
.btn-notion{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:6px;background:#1a1a2e;color:#fff;font-size:12px;font-weight:600;text-decoration:none;border:none;cursor:pointer;font-family:inherit;transition:background .2s;margin-top:8px}
.btn-notion:hover{background:#2d2d4e}
.btn-primary{background:#1a1a2e;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary:hover{background:#2d2d4e}
.proj-filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.fb{padding:6px 14px;border:1.5px solid #ddd;border-radius:20px;background:#fff;font-size:13px;cursor:pointer;transition:all .15s;font-family:inherit}
.fb:hover{border-color:#4a90e2;color:#4a90e2}
.fb.active{background:#1a1a2e;color:#fff;border-color:#1a1a2e}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h2{font-size:18px;margin-bottom:20px}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:13px;font-weight:600;color:#555;margin-bottom:5px}
.fc{width:100%;padding:9px 12px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:14px;font-family:inherit;background:#fafafa;outline:none;transition:border-color .2s}
.fc:focus{border-color:#4a90e2;background:#fff}
.frow{display:flex;gap:10px}
.frow .fg{flex:1}
.modal-acts{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.btn-cancel{padding:9px 18px;border-radius:8px;border:1.5px solid #ddd;background:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.btn-cancel:hover{background:#f5f5f5}
.ms-edit-item{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.ms-edit-item input[type=text]{flex:1;padding:6px 10px;border:1.5px solid #e0e0e0;border-radius:6px;font-size:13px;font-family:inherit;outline:none}
.ms-edit-item input[type=date]{width:140px;padding:6px 10px;border:1.5px solid #e0e0e0;border-radius:6px;font-size:13px;font-family:inherit;outline:none}
.ms-edit-item input:focus{border-color:#4a90e2}
.btn-add-ms{font-size:12px;padding:5px 12px;background:#f0f2f5;border:1px solid #ddd;border-radius:6px;cursor:pointer;font-family:inherit}
.btn-add-ms:hover{background:#e8e8e8}
.btn-rm-ms{border:none;background:#fee2e2;color:#dc2626;border-radius:6px;width:24px;height:24px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.kr-checkbox-list{display:flex;flex-direction:column;gap:8px;max-height:200px;overflow-y:auto;border:1.5px solid #e0e0e0;border-radius:8px;padding:10px;background:#fafafa}
.kr-checkbox-item{display:flex;align-items:flex-start;gap:8px;font-size:13px;cursor:pointer;padding:4px 0}
.kr-checkbox-item input[type=checkbox]{width:14px;height:14px;margin-top:1px;cursor:pointer;accent-color:#4a90e2;flex-shrink:0}
.kr-checkbox-org-label{font-size:11px;font-weight:700;color:#888;text-transform:uppercase;padding:4px 0 2px;letter-spacing:.5px}

/* Tasks */
.add-card{background:#fff;border-radius:12px;padding:20px;margin-bottom:24px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.add-card-title{font-size:13px;font-weight:600;margin-bottom:14px;color:#555;text-transform:uppercase;letter-spacing:.5px}
.frow-t{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.frow-t input[type=text],.frow-t input[type=date],.frow-t select{flex:1;min-width:110px;padding:9px 12px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:14px;font-family:inherit;background:#fafafa;transition:border-color .2s;outline:none}
.frow-t input:focus,.frow-t select:focus{border-color:#4a90e2;background:#fff}
.filters-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;align-items:center}
.fsearch{padding:6px 12px;border:1.5px solid #ddd;border-radius:20px;font-size:13px;font-family:inherit;outline:none;width:180px;transition:border-color .2s;margin-left:auto}
.fsearch:focus{border-color:#4a90e2}
.columns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.column{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.col-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid #f0f0f0}
.col-title{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.cdot{width:10px;height:10px;border-radius:50%}
.col-todo .cdot{background:#94a3b8}.col-doing .cdot{background:#f59e0b}.col-done .cdot{background:#22c55e}
.ccnt{background:#f0f2f5;border-radius:12px;padding:2px 8px;font-size:12px;color:#666;font-weight:600}
.tlist{display:flex;flex-direction:column;gap:10px;min-height:60px}
.tcard{border:1.5px solid #eee;border-radius:10px;padding:12px 14px;background:#fafafa;transition:box-shadow .15s,transform .1s}
.tcard:hover{box-shadow:0 4px 12px rgba(0,0,0,.1);transform:translateY(-1px)}
.tcard.done-card{opacity:.6}
.ttop{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ttitle{font-size:14px;font-weight:600;line-height:1.4;word-break:break-word}
.done-card .ttitle{text-decoration:line-through;color:#aaa}
.tmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;white-space:nowrap}
.ph{background:#fee2e2;color:#dc2626}.pm{background:#fef3c7;color:#d97706}.pl{background:#e0f2fe;color:#0284c7}
.bc{background:#ede9fe;color:#7c3aed}.bt{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0}.bp{background:#dbeafe;color:#1d4ed8}
.bdue{font-size:11px;color:#888}.bdue.ov{color:#dc2626;font-weight:600}
.tacts{display:flex;gap:4px;flex-shrink:0}
.btn-st{border:none;border-radius:6px;padding:4px 8px;font-size:11px;cursor:pointer;font-family:inherit;font-weight:600;background:#e8f4fd;color:#1a6fb5}
.btn-st:hover{background:#d0eaf8}
.btn-dl{border:none;border-radius:6px;padding:4px 8px;font-size:11px;cursor:pointer;font-family:inherit;font-weight:600;background:#fee2e2;color:#dc2626}
.btn-dl:hover{background:#fecaca}
.empty{text-align:center;color:#ccc;font-size:13px;padding:20px 0}

/* Monitor */
.mon-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:gap}
.btn-refresh{padding:8px 16px;border-radius:8px;border:1.5px solid #ddd;background:#fff;font-size:13px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px;transition:background .15s}
.btn-refresh:hover{background:#f5f5f5}
.btn-refresh.loading{opacity:.6;pointer-events:none}
.no-cfg{text-align:center;padding:60px 20px;color:#888;font-size:14px;line-height:2.2}
.no-cfg a{color:#4a90e2;cursor:pointer;text-decoration:underline}
.org-sec{margin-bottom:28px}
.org-sec-title{font-size:15px;font-weight:700;padding:12px 18px;color:#fff;border-radius:10px 10px 0 0;display:flex;align-items:center;gap:10px}
.org-body{background:#fff;border-radius:0 0 10px 10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.kpi-sec{border-bottom:1px solid #f0f0f0}
.kpi-sec:last-child{border-bottom:none}
.kpi-head{padding:12px 18px;background:#f8f9fb;border-bottom:1px solid #eee;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.kpi-name{font-size:14px;font-weight:600}
.kpi-totals{font-size:12px;color:#666}
.kpi-rate{margin-left:auto;font-size:14px;font-weight:700}
.kpi-bar-wrap{padding:4px 18px 8px}
.kbar{height:7px;background:#eee;border-radius:4px;overflow:hidden}
.kbar-fill{height:100%;border-radius:4px;transition:width .5s}
.kbar-fill.ko{background:#22c55e}.kbar-fill.kw{background:#f59e0b}.kbar-fill.kd{background:#ef4444}.kbar-fill.kn{background:#3b82f6}
.proj-rows{padding:4px 18px 12px}
.proj-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #f5f5f5;font-size:13px}
.proj-row:last-child{border-bottom:none}
.pr-name{flex:1;font-weight:500}
.pr-tgt{color:#888;width:80px;text-align:right;font-size:12px}
.pr-act{font-weight:700;width:80px;text-align:right}
.pr-bar{flex:1;max-width:100px;height:5px;background:#eee;border-radius:3px;overflow:hidden}
.pr-bar-fill{height:100%;border-radius:3px;background:#3b82f6}
.pr-rate{width:52px;text-align:right;font-size:12px;font-weight:700}
.ro{color:#16a34a}.rw{color:#d97706}.rd{color:#dc2626}
.mon-tabs{display:flex;gap:8px;margin-bottom:24px;border-bottom:2px solid #f0f0f0;padding-bottom:0}
.mon-tab-btn{padding:8px 16px;border:none;background:transparent;font-size:14px;font-family:inherit;cursor:pointer;color:#888;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.mon-tab-btn.active{color:#1a1a2e;border-bottom-color:#1a1a2e;font-weight:700}
.mon-tab-content{display:none}
.mon-tab-content.active{display:block}
.mon-table{width:100%;border-collapse:collapse;font-size:13px}
.mon-table th{padding:10px 14px;background:#f8f9fb;font-weight:700;color:#555;text-align:left;border-bottom:2px solid #eee;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.mon-table td{padding:10px 14px;border-bottom:1px solid #f5f5f5}
.mon-table tr:last-child td{border-bottom:none}
.mon-table tr:hover td{background:#f9f9f9}

/* Settings */
.settings-sec{margin-bottom:28px}
.settings-sec h3{font-size:13px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px}
.hint{font-size:12px;color:#999;margin-top:4px}
.col-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.notice{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:12px;font-size:13px;color:#666;line-height:1.8}
.btn-save{background:#1a1a2e;color:#fff;border:none;border-radius:8px;padding:10px 24px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .2s}
.btn-save:hover{background:#2d2d4e}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;background:#1a1a2e;color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1}

/* Settings org tabs */
.settings-org-tabs{display:flex;gap:0;border-bottom:2px solid #e0e0e0;margin-bottom:0}
.settings-org-tab{padding:10px 18px;border:none;background:transparent;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;color:#888;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .2s;white-space:nowrap;display:flex;align-items:center;gap:6px}
.settings-org-tab:hover{color:#1a1a2e}
.settings-org-tab.active{color:#1a1a2e;border-bottom-color:#1a1a2e}
.settings-org-panel{display:none;padding:20px 0}
.settings-org-panel.active{display:block}
.settings-subsec{background:#fff;border-radius:12px;border:1.5px solid #e0e0e0;margin-bottom:16px;overflow:hidden}
.settings-subsec-head{display:flex;align-items:center;gap:10px;padding:14px 18px;font-size:14px;font-weight:700;background:#fafafa;border-bottom:1px solid #eee;cursor:pointer;user-select:none}
.settings-subsec-head:hover{background:#f0f2f5}
.settings-subsec-body{padding:16px 18px}
.settings-subsec-chevron{font-size:11px;color:#999;transition:transform .2s;margin-left:auto}
.settings-subsec.open .settings-subsec-chevron{transform:rotate(90deg)}
.settings-subsec-body{display:none}
.settings-subsec.open .settings-subsec-body{display:block}
/* Sheet/DB item cards */
.item-card{border:1.5px solid #e8e8e8;border-radius:10px;margin-bottom:10px;overflow:hidden}
.item-card-head{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#f9f9f9;cursor:pointer;user-select:none}
.item-card-head:hover{background:#f0f2f5}
.item-card-label{flex:1;font-size:13px;font-weight:600}
.item-card-status{font-size:11px;color:#888}
.item-card-body{display:none;padding:14px;border-top:1px solid #eee}
.item-card.open .item-card-body{display:block}
.item-card-chevron{font-size:10px;color:#aaa;transition:transform .2s}
.item-card.open .item-card-chevron{transform:rotate(90deg)}
.btn-add-item{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1.5px dashed #ccc;background:transparent;font-size:13px;color:#888;cursor:pointer;width:100%;font-family:inherit;transition:all .2s;margin-top:4px}
.btn-add-item:hover{border-color:#4a90e2;color:#4a90e2;background:#f0f6ff}
.btn-rm-item{border:none;background:#fee2e2;color:#dc2626;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:600;transition:background .15s}
.btn-rm-item:hover{background:#fecaca}
/* Toggle switch */
.toggle-switch{position:relative;display:inline-block;width:42px;height:24px;flex-shrink:0}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;cursor:pointer;inset:0;background:#ccc;border-radius:24px;transition:.3s}
.toggle-slider::before{position:absolute;content:'';height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
.toggle-switch input:checked + .toggle-slider{background:#10b981}
.toggle-switch input:checked + .toggle-slider::before{transform:translateX(18px)}

.ro{color:#16a34a}.rw{color:#d97706}.rd{color:#dc2626}
@media(max-width:800px){.dash-grid,.stats-row,.summary-bar{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}.project-grid{grid-template-columns:1fr}.kr-item{grid-template-columns:1fr 100px;}.kr-item>*:nth-child(n+3){display:none}}
</style>
</head>

    objectives: [

          { id:'pr_o1_kr1', name:'成功事例メディア掲載数', target:10, unit:'件' },

// Get all KRs flat
function allKRs() {
  const list = [];
  for (const orgId of Object.keys(OKR_DATA)) {
    const org = ORG_META[orgId];
    for (const obj of OKR_DATA[orgId].objectives) {
      for (const kr of obj.krs) {
        list.push({ ...kr, orgId, orgName: org.name, objId: obj.id, objName: obj.name });
      }
    }
  }
  return list;
}

function getKRById(krId) {
  return allKRs().find(k => k.id === krId);
}

// ================== STATE ==================
function defaultOrgSettings() {
  const orgs = {};
  for (const id of Object.keys(ORG_META)) {
    orgs[id] = {
      notion: { enabled: false, token: '', dbs: [] },
      sheets: []
    };
  }
  return orgs;
}

let state = {
  projects: [],
  tasks: [],
  actuals: {},
  settings: { notionProxy: '', orgs: defaultOrgSettings() },
  sheetsData: {}   // { orgId_sheetUid: rows[] }
};

function loadState() {
  try { state.projects = JSON.parse(localStorage.getItem('bj_projects_v2') || '[]'); } catch(e){}
  try { state.tasks    = JSON.parse(localStorage.getItem('bj_tasks_v1')    || '[]'); } catch(e){}
  try { state.actuals  = JSON.parse(localStorage.getItem('bj_okr_actuals') || '{}'); } catch(e){}
  try {
    const saved = JSON.parse(localStorage.getItem('bj_settings') || '{}');
    const defaults = defaultOrgSettings();
    const orgs = {};
    for (const id of Object.keys(ORG_META)) {
      orgs[id] = {
        notion: { ...defaults[id].notion, ...(saved.orgs?.[id]?.notion || {}) },
        sheets:  saved.orgs?.[id]?.sheets || []
      };
    }
    state.settings = { notionProxy: saved.notionProxy || '', orgs };

  renderSettingsOrgs();
}

let settingsOrgTab = 'hr';

// ---- Add / Remove items ----
function addNotionDB(orgId) {
  state.settings.orgs[orgId].notion.dbs.push({ id:'', name:'' });
  refreshOrgPanel(orgId);
}
function removeNotionDB(orgId, idx) {
  state.settings.orgs[orgId].notion.dbs.splice(idx, 1);
  refreshOrgPanel(orgId);
}
function addSheet(orgId) {
  state.settings.orgs[orgId].sheets.push({
    uid: 'sh_' + Date.now(), label:'', sheetsId:'', apiKey:'',
    sheetName:'Sheet1', headerRow:2, c0:0, c1:1, c2:2, c3:3, c4:4
  });
  refreshOrgPanel(orgId);
}
function removeSheet(orgId, idx) {
  state.settings.orgs[orgId].sheets.splice(idx, 1);
  refreshOrgPanel(orgId);
}
function refreshOrgPanel(orgId) {
  // collect current values before re-render
  collectOrgSettings(orgId);
  const meta = ORG_META[orgId];
  const panel = document.getElementById('settings-panel-' + orgId);
  if (panel) panel.innerHTML = buildOrgPanel(orgId, meta);
  // refresh subsection count labels in tabs (re-render tabs)
  renderSettingsOrgs();
  // re-activate current tab without losing state
  document.querySelectorAll('.settings-org-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('settings-panel-' + settingsOrgTab)?.classList.add('active');
}

// ---- Collect form values into state (before save / before re-render) ----
function collectOrgSettings(orgId) {
  const cfg = state.settings.orgs[orgId];
  cfg.notion.enabled = document.getElementById('notion-enabled-' + orgId)?.checked || false;
  cfg.notion.token   = document.getElementById('notion-token-'   + orgId)?.value.trim() || '';

    c4: parseInt(document.getElementById(`sh-c4-${orgId}-${i}`)?.value) ?? sh.c4,

}

// ================== DASHBOARD ==================
function krAchRate(kr) {
  const a = state.actuals[kr.id];
  if (!a || a.actual === '' || a.actual === null || a.actual === undefined) return null;
  const act = parseFloat(a.actual);
  if (isNaN(act) || !kr.target) return null;
  if (kr.lowerIsBetter) {
    return Math.min(200, Math.round((kr.target / act) * 100));
  }
  return Math.min(200, Math.round((act / kr.target) * 100));
}

function orgAchRate(orgId) {
  const org = OKR_DATA[orgId];
  let total = 0, count = 0;
  for (const obj of org.objectives) {
    for (const kr of obj.krs) {
      const r = krAchRate(kr);
      if (r !== null) { total += r; count++; }
    }
  }
  return count > 0 ? Math.round(total / count) : null;
}

function rateClass(r) {
  if (r === null) return 'kbar-fill kn';
  if (r >= 100) return 'kbar-fill ko';
  if (r >= 70) return 'kbar-fill kn';
  if (r >= 40) return 'kbar-fill kw';
  return 'kbar-fill kd';
}
function rateTextClass(r) {
  if (r === null) return '';
  if (r >= 100) return 'ro';
  if (r >= 70) return '';
  if (r >= 40) return 'rw';
  return 'rd';
}

function renderDashboard() {
  const orgIds = ['hr','pr','corp','group'];
  const orgCardsEl = document.getElementById('dash-org-cards');
  orgCardsEl.innerHTML = orgIds.map(orgId => {
    const meta = ORG_META[orgId];
    const rate = orgAchRate(orgId);
    const objCount = OKR_DATA[orgId].objectives.length;
    const krCount = OKR_DATA[orgId].objectives.reduce((s,o)=>s+o.krs.length,0);
    const dataKRs = OKR_DATA[orgId].objectives.reduce((s,o)=>s+o.krs.filter(kr=>state.actuals[kr.id]?.actual!==undefined&&state.actuals[kr.id]?.actual!=='').length,0);
    const rateDisp = rate !== null ? rate + '%' : '—';
    const fillW = rate !== null ? Math.min(100,rate) : 0;
    return `<div class="org-summary-card" style="border-top-color:${meta.color}" onclick="switchToOKR('${orgId}')">
      <div class="osc-head">
        <div class="osc-icon" style="background:${meta.bg};color:${meta.color}">${meta.icon}</div>
        <div><div class="osc-name">${meta.name}</div><div class="osc-obj-count">Objective ${objCount}個 / KR ${krCount}個</div></div>
      </div>
      <div class="osc-rate ${rateTextClass(rate)}">${rateDisp}</div>
      <div class="osc-bar"><div class="${rateClass(rate)}" style="width:${fillW}%;background:${meta.color}"></div></div>
      <div class="osc-krs">${dataKRs}/${krCount} KRにデータあり</div>
    </div>`;
  }).join('');

  const active = state.projects.filter(p=>p.status==='active');
  const warn = state.projects.filter(p=>p.status==='warning'||p.status==='delayed');
  const done = state.projects.filter(p=>p.status==='completed');
  const today = new Date(); today.setHours(0,0,0,0);
  const overdue = state.tasks.filter(t=>t.status!=='done'&&t.due&&new Date(t.due)<today);

  document.getElementById('dash-stats').innerHTML = [
    `<div class="stat-card"><div class="stat-num n-active">${state.projects.length}</div><div class="stat-lbl">総プロジェクト数</div></div>`,
    `<div class="stat-card"><div class="stat-num n-active">${active.length}</div><div class="stat-lbl">進行中</div></div>`,
    `<div class="stat-card"><div class="stat-num n-warn">${warn.length}</div><div class="stat-lbl">要注意・遅延</div></div>`,
    `<div class="stat-card"><div class="stat-num n-done">${done.length}</div><div class="stat-lbl">完了</div></div>`
  ].join('');

  const activeProjEl = document.getElementById('dash-active-projects');
  document.getElementById('active-proj-count').textContent = `${active.length}件`;
  if (active.length === 0) {
    activeProjEl.innerHTML = '<div class="empty" style="background:#fff;border-radius:12px;padding:30px">進行中のプロジェクトがありません</div>';
  } else {
    activeProjEl.innerHTML = active.slice(0,6).map(p => {
      const meta = ORG_META[p.org] || { color:'#94a3b8', name:p.org||'' };
      const prog = projectProgress(p);
      const linkedKRNames = (p.linkedKRs||[]).map(id=>getKRById(id)?.name||id).slice(0,2);
      return `<div class="mini-proj-card" style="border-left-color:${meta.color}">
        <div class="mpc-name">${e(p.name)}</div>
        <div class="mpc-meta">
          <span style="background:${meta.bg||'#f0f0f0'};color:${meta.color};padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600">${meta.name}</span>
          ${p.endDate?`<span>${p.endDate}</span>`:''}
        </div>
        ${linkedKRNames.length?`<div style="font-size:11px;color:#888;margin-bottom:6px">→ ${linkedKRNames.join('・')}</div>`:''}
        <div class="mpc-prog"><div class="mpc-prog-fill" style="width:${prog}%;background:${meta.color}"></div></div>
      </div>`;
    }).join('');
  }

  const upcoming = [...state.tasks].filter(t=>t.status!=='done').sort((a,b)=>{
    if (!a.due && !b.due) return 0;
    if (!a.due) return 1;
    if (!b.due) return -1;
    return new Date(a.due)-new Date(b.due);
  }).slice(0,8);
  const taskEl = document.getElementById('dash-tasks');
  if (upcoming.length === 0) {
    taskEl.innerHTML = '<div class="tq-item"><span class="tq-title" style="color:#ccc">タスクがありません</span></div>';
  } else {
    taskEl.innerHTML = upcoming.map(t => {
      const ov = t.due && new Date(t.due) < today;
      const pColor = t.priority==='high'?'#ef4444':t.priority==='mid'?'#f59e0b':'#3b82f6';
      return `<div class="tq-item">
        <div class="tq-dot" style="background:${pColor}"></div>
        <div class="tq-title">${e(t.title)}</div>
        <div class="tq-due ${ov?'tq-ov':''}">${t.due?fmtDate(t.due)+(ov?' ⚠':''):''}</div>
      </div>`;
    }).join('');
  }
}

function liveUpdateKR(krId, val) {
  const kr = getKRById(krId);
  if (!kr) return;
  const tmpActual = val === '' ? null : parseFloat(val);
  let rate = null;
  if (tmpActual !== null && !isNaN(tmpActual) && kr.target) {
    if (kr.lowerIsBetter) rate = Math.min(200, Math.round((kr.target/tmpActual)*100));
    else rate = Math.min(200, Math.round((tmpActual/kr.target)*100));
  }
  const barEl = document.getElementById('krbar-' + krId);
  const rateEl = document.getElementById('krrate-' + krId);
  if (barEl) { barEl.style.width = (rate!==null?Math.min(100,rate):0)+'%'; barEl.className = rateClass(rate); }
  if (rateEl) { rateEl.textContent = rate!==null?rate+'%':'—'; rateEl.className = 'kr-rate '+rateTextClass(rate); }
}

function exportOKR() {
  let text = '2026年度 OKRサマリー\n\n';
  for (const orgId of Object.keys(OKR_DATA)) {
    const meta = ORG_META[orgId];
    text += `【${meta.name}】\n`;
    for (const obj of OKR_DATA[orgId].objectives) {
      text += `  ◎ ${obj.name}\n`;
      for (const kr of obj.krs) {
        const a = state.actuals[kr.id];
        const rate = krAchRate(kr);
        text += `    KR: ${kr.name} | 目標:${kr.target}${kr.unit} | 実績:${a?.actual??'—'} | 達成率:${rate!==null?rate+'%':'未入力'}\n`;
      }
    }
    text += '\n';
  }
  navigator.clipboard.writeText(text).then(() => toast('OKRサマリーをクリップボードにコピーしました'));
}

function projectProgress(p) {
  if (p.status === 'completed') return 100;
  const ms = p.milestones || [];
  if (!ms.length) {
    if (!p.startDate || !p.endDate) return 0;
    const start = new Date(p.startDate), end = new Date(p.endDate), now = new Date();
    const total = end - start, elapsed = now - start;
    if (total <= 0) return 0;
    return Math.min(100, Math.max(0, Math.round((elapsed/total)*100)));
  }
  return Math.round((ms.filter(m=>m.done).length / ms.length) * 100);
}

function saveProject() {
  const name = document.getElementById('pm-name').value.trim();
  if (!name) { toast('プロジェクト名を入力してください'); return; }
  const linkedKRs = Array.from(document.getElementById('kr-checkbox-list').querySelectorAll('input[type=checkbox]:checked')).map(i=>i.value);
  const milestones = Array.from(document.getElementById('ms-list').querySelectorAll('.ms-edit-item')).map(row => {
    const inputs = row.querySelectorAll('input');
    return { id: 'ms_' + Date.now() + Math.random(), name: inputs[0].value, date: inputs[1].value, done: inputs[2].checked };
  }).filter(m=>m.name);
  const proj = {
    id: editProjId || 'p_' + Date.now(),
    name,
    org: document.getElementById('pm-org').value,
    status: document.getElementById('pm-status').value,
    startDate: document.getElementById('pm-start').value,
    endDate: document.getElementById('pm-end').value,
    notionUrl: document.getElementById('pm-notion').value.trim(),
    description: document.getElementById('pm-desc').value.trim(),
    linkedKRs,
    milestones,
    createdAt: editProjId ? (state.projects.find(p=>p.id===editProjId)?.createdAt||new Date().toISOString()) : new Date().toISOString()
  };
  if (editProjId) {
    const idx = state.projects.findIndex(p=>p.id===editProjId);
    if (idx >= 0) state.projects[idx] = proj;
  } else {
    state.projects.push(proj);
  }
  saveProjects();
  closeProjModal();
  renderProjects();
  renderDashboard();
  toast(editProjId ? 'プロジェクトを更新しました' : 'プロジェクトを追加しました');
}

function deleteProject(id) {

  state.projects = state.projects.filter(p=>p.id!==id);

}

function addTask() {
  const title = document.getElementById('t-title').value.trim();
  if (!title) return;
  const due = document.getElementById('t-due').value;
  const priority = document.getElementById('t-priority').value;
  const projId = document.getElementById('t-proj-sel').value;
  const tags = document.getElementById('t-tags').value.split(',').map(t=>t.trim()).filter(Boolean);
  const projName = projId ? (state.projects.find(p=>p.id===projId)?.name||'') : '';
  state.tasks.push({ id:'t_'+Date.now(), title, due, priority, category: projName, tags, status:'todo', createdAt: new Date().toISOString() });
  saveTasks();
  document.getElementById('t-title').value=''; document.getElementById('t-due').value=''; document.getElementById('t-tags').value='';
  renderTasks();
}

function renderTasks() {
  const today = new Date(); today.setHours(0,0,0,0);
  const q = document.getElementById('t-search').value.toLowerCase();
  let tasks = state.tasks.filter(t => {
    if (q && !t.title.toLowerCase().includes(q)) return false;
    if (taskFilter === 'high' && t.priority !== 'high') return false;
    if (taskFilter === 'overdue' && (t.status==='done' || !t.due || new Date(t.due)>=today)) return false;
    return true;
  });
  ['todo','doing','done'].forEach(st => {
    const list = tasks.filter(t=>t.status===st);
    document.getElementById('cnt-'+st).textContent = list.length;
    document.getElementById('list-'+st).innerHTML = list.length ? list.map(t => {
      const ov = t.due && new Date(t.due)<today && t.status!=='done';
      const priCls = {high:'ph',mid:'pm',low:'pl'}[t.priority]||'pm';
      const priLbl = {high:'高',mid:'中',low:'低'}[t.priority]||t.priority;
      const nextSt = {todo:'doing',doing:'done',done:'todo'}[t.status];
      const nextLbl = {todo:'対応中へ',doing:'完了へ',done:'戻す'}[t.status];
      return `<div class="tcard ${t.status==='done'?'done-card':''}">
        <div class="ttop">
          <div class="ttitle">${e(t.title)}</div>
          <div class="tacts">
            <button class="btn-st" onclick="moveTask('${t.id}','${nextSt}')">${nextLbl}</button>
            <button class="btn-dl" onclick="delTask('${t.id}')">✕</button>
          </div>
        </div>
        <div class="tmeta">
          <span class="badge ${priCls}">${priLbl}</span>
          ${t.category?`<span class="badge bc">${e(t.category)}</span>`:''}
          ${(t.tags||[]).map(tg=>`<span class="badge bt">${e(tg)}</span>`).join('')}
          ${t.due?`<span class="bdue ${ov?'ov'  :''}">${ov?'⚠ ':''  }${fmtDate(t.due)}</span>`:''}
        </div>
      </div>`;
    }).join('') : '<div class="empty">タスクなし</div>';
  });
  // Update project select
  const sel = document.getElementById('t-proj-sel');
  const curVal = sel.value;
  sel.innerHTML = '<option value="">プロジェクト</option>' + state.projects.map(p=>`<option value="${p.id}" ${p.id===curVal?'selected':''}>${e(p.name)}</option>`).join('');
}

function moveTask(id, st) {
  const t = state.tasks.find(x=>x.id===id);
  if (t) { t.status = st; saveTasks(); renderTasks(); }
}

function delTask(id) {
  state.tasks = state.tasks.filter(t=>t.id!==id);
  saveTasks(); renderTasks();
}

async function fetchSheets() {
  const orgs = state.settings.orgs;
  const allSheets = [];
  for (const [orgId, cfg] of Object.entries(orgs)) {
    for (const sh of cfg.sheets) {
      if (sh.sheetsId && sh.apiKey) allSheets.push({ orgId, sh });
    }
  }
  if (!allSheets.length) {
    toast('設定で各組織のスプレッドシートを登録してください');
    document.querySelector('[data-tab="settings"]').click();
    return;
  }
  const btn = document.getElementById('btn-refresh');
  btn.classList.add('loading'); btn.textContent = '🔄 取得中...';
  let totalRows = 0, errors = [];
  state.sheetsData = {};

  await Promise.all(allSheets.map(async ({ orgId, sh }) => {
    try {
      const range = encodeURIComponent(`${sh.sheetName}!A${sh.headerRow}:Z1000`);
      const url = `https://sheets.googleapis.com/v4/spreadsheets/${sh.sheetsId}/values/${range}?key=${sh.apiKey}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`${res.status}`);
      const data = await res.json();
      const rows = data.values || [];
      const key = `${orgId}__${sh.uid||sh.sheetsId}`;
      state.sheetsData[key] = { orgId, label: sh.label||sh.sheetName, rows, sh };
      totalRows += rows.length;
    } catch(err) {
      errors.push(`${ORG_META[orgId].name}「${sh.label||sh.sheetName}」: ${err.message}`);
    }
  }));

  renderSheetsRaw();
  renderOKRMonitor();
  if (errors.length) toast(`⚠ ${errors.length}件のエラーがありました`);
  else toast(`✅ 計${totalRows}行を取得しました`);
  btn.classList.remove('loading'); btn.textContent = '🔄 データを更新';
}

function renderSheetsRaw() {
  const el = document.getElementById('mon-sheets-content');
  const allEntries = Object.values(state.sheetsData || {});
  if (!allEntries.length) {
    el.innerHTML = `<div class="no-cfg">シートデータがありません。<br>設定で各組織のスプレッドシートを登録後、「データを更新」を押してください。<br><a onclick="document.querySelector('[data-tab=settings]').click()">⚙ 設定を開く</a></div>`;
    return;
  }

  // Group by orgId
  const byOrg = {};
  for (const entry of allEntries) {
    if (!byOrg[entry.orgId]) byOrg[entry.orgId] = [];
    byOrg[entry.orgId].push(entry);
  }

  el.innerHTML = Object.entries(byOrg).map(([orgId, entries]) => {
    const meta = ORG_META[orgId] || { name: orgId, color:'#1a1a2e' };
    const sheetsHtml = entries.map(({ label, rows, sh }) => {
      const kpis = {};
      rows.forEach(row => {
        const kpi  = (row[sh.c0]||'').trim();
        const proj = (row[sh.c1]||'').trim();
        const unit = (row[sh.c2]||'').trim();
        const tgt  = parseFloat(row[sh.c3]);
        const act  = parseFloat(row[sh.c4]);
        if (!kpi) return;
        if (!kpis[kpi]) kpis[kpi] = { unit, projects:[], totalTgt:0, totalAct:0 };
        if (proj) kpis[kpi].projects.push({ proj, unit, tgt, act });
        if (!isNaN(tgt)) kpis[kpi].totalTgt += tgt;
        if (!isNaN(act)) kpis[kpi].totalAct += act;
      });
      return `
        <div style="padding:10px 18px 4px;font-size:12px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #f0f0f0">
          📊 ${e(label)} <span style="font-weight:400">(${rows.length}行)</span>
        </div>
        ${Object.entries(kpis).map(([kpi, data]) => {
          const rate = data.totalTgt>0 ? Math.round((data.totalAct/data.totalTgt)*100) : null;
          const fillW = rate!==null ? Math.min(100,rate) : 0;
          return `<div class="kpi-sec">
            <div class="kpi-head">
              <div class="kpi-name">${e(kpi)}</div>
              <div class="kpi-totals">目標:${isNaN(data.totalTgt)?'—':data.totalTgt.toLocaleString()} ${e(data.unit)} / 実績:${isNaN(data.totalAct)?'—':data.totalAct.toLocaleString()} ${e(data.unit)}</div>
              ${rate!==null?`<div class="kpi-rate ${rateTextClass(rate)}">${rate}%</div>`:`<div class="kpi-rate" style="color:#ccc">—</div>`}
            </div>
            <div class="kpi-bar-wrap"><div class="kbar"><div class="${rateClass(rate)}" style="width:${fillW}%"></div></div></div>
            <div class="proj-rows">
              ${data.projects.map(pr => {
                const r2 = pr.tgt>0 ? Math.min(100,Math.round((pr.act/pr.tgt)*100)) : null;
                return `<div class="proj-row">
                  <div class="pr-name">${e(pr.proj)}</div>
                  <div class="pr-tgt">${isNaN(pr.tgt)?'—':pr.tgt.toLocaleString()} ${e(pr.unit)}</div>
                  <div class="pr-act">${isNaN(pr.act)?'—':pr.act.toLocaleString()}</div>
                  <div class="pr-bar"><div class="pr-bar-fill" style="width:${r2||0}%"></div></div>
                  <div class="pr-rate ${rateTextClass(r2)}">${r2!==null?r2+'%':'—'}</div>
                </div>`;
              }).join('')}
            </div>
          </div>`;
        }).join('')}`;
    }).join('');

    return `<div class="org-sec">
      <div class="org-sec-title" style="background:${meta.color}">${meta.icon||''} ${meta.name}</div>
      <div class="org-body">${sheetsHtml}</div>
    </div>`;
  }).join('');
}

// ================== SETTINGS ==================
function saveSettings() {
  const notion = {};
  for (const orgId of Object.keys(ORG_META)) {
    notion[orgId] = {
      enabled:  document.getElementById('notion-enabled-' + orgId)?.checked || false,
      token:    document.getElementById('notion-token-'   + orgId)?.value.trim() || '',
      dbId:     document.getElementById('notion-dbid-'    + orgId)?.value.trim() || '',
      dbName:   document.getElementById('notion-dbname-'  + orgId)?.value.trim() || ''
    };
  }
  state.settings = {
    ...state.settings,
    sheetsId:    document.getElementById('s-sheets-id').value.trim(),
    apiKey:      document.getElementById('s-api-key').value.trim(),
    sheetName:   document.getElementById('s-sheet-name').value.trim() || 'KPI',
    headerRow:   parseInt(document.getElementById('s-header-row').value)||2,
    c0: parseInt(document.getElementById('s-c0').value)||0,
    c1: parseInt(document.getElementById('s-c1').value)||1,
    c2: parseInt(document.getElementById('s-c2').value)||2,
    c3: parseInt(document.getElementById('s-c3').value)||3,
    c4: parseInt(document.getElementById('s-c4').value)||4,
    c5: parseInt(document.getElementById('s-c5').value)||5,
    notionProxy: document.getElementById('s-notion-proxy').value.trim(),
    notion
  };
  localStorage.setItem('bj_settings', JSON.stringify(state.settings));
  renderNotionOrgSettings();
  toast('設定を保存しました');
}

function exportData() {
  const data = { projects: state.projects, tasks: state.tasks, actuals: state.actuals };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'bj_pm_data.json'; a.click();
}

function importDataClick() { document.getElementById('import-file').click(); }

function importData(evt) {
  const file = evt.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.projects) state.projects = data.projects;
      if (data.tasks) state.tasks = data.tasks;
      if (data.actuals) state.actuals = data.actuals;
      saveProjects(); saveTasks(); saveActuals();
      renderDashboard(); toast('データをインポートしました');
    } catch(err) { toast('インポートに失敗しました'); }
  };
  reader.readAsText(file);
}

function clearAllData() {
  if (!confirm('すべてのデータ（プロジェクト・タスク・KR実績）を削除しますか？この操作は取り消せません。')) return;
  state.projects=[]; state.tasks=[]; state.actuals={};
  saveProjects(); saveTasks(); saveActuals();
  renderDashboard(); toast('データを削除しました');
}

// ================== UTILS ==================
function e(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(d) {
  if (!d) return '';
  const dt = new Date(d); if (isNaN(dt)) return d;
  return `${dt.getFullYear()}/${String(dt.getMonth()+1).padStart(2,'0')}/${String(dt.getDate()).padStart(2,'0')}`;
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast'); el.textContent = msg;
  el.classList.add('show'); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

// Close modal on overlay click
document.getElementById('proj-modal').addEventListener('click', function(e) {
  if (e.target === this) closeProjModal();
});

// ================== INIT ==================
loadState();
renderDashboard();
renderOKR();
</script>
