<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Borderless Workboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;background:#f0f2f5;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.logo{font-size:36px;margin-bottom:12px}
h1{font-size:22px;font-weight:800;color:#1a1a2e;margin-bottom:6px}
.sub{font-size:14px;color:#888;margin-bottom:48px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;width:100%;max-width:800px}
.card{background:#fff;border-radius:16px;padding:28px 24px;box-shadow:0 2px 12px rgba(0,0,0,.08);text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:10px;transition:box-shadow .2s,transform .15s;border-top:4px solid #ccc}
.card:hover{box-shadow:0 6px 24px rgba(0,0,0,.13);transform:translateY(-3px)}
.card-icon{font-size:32px}
.card-name{font-size:16px;font-weight:700;color:#1a1a2e}
.card-desc{font-size:13px;color:#888;line-height:1.6}
.card-arrow{font-size:20px;color:#ccc;margin-top:auto;padding-top:8px}
</style>
</head>
<body>
  <div class="logo">🌏</div>
  <h1>Borderless Workboard</h1>
  <p class="sub">ボーダレスジャパン プロジェクト管理ツール</p>
  <div class="cards">
    <a class="card" href="/プロジェクト管理.html" style="border-top-color:#3b82f6">
      <div class="card-icon">📊</div>
      <div class="card-name">プロジェクト管理</div>
      <div class="card-desc">OKR・プロジェクト・タスク・KPIモニタリングの統合ダッシュボード</div>
      <div class="card-arrow">→</div>
    </a>
    <a class="card" href="/タスク管理.html" style="border-top-color:#10b981">
      <div class="card-icon">📋</div>
      <div class="card-name">タスク管理</div>
      <div class="card-desc">シンプルなカンバンボード。ToDo・対応中・完了でタスクを管理</div>
      <div class="card-arrow">→</div>
    </a>
    <a class="card" href="/timer.html" style="border-top-color:#f59e0b">
      <div class="card-icon">⏱</div>
      <div class="card-name">タイマー</div>
      <div class="card-desc">カウントダウンタイマー。時間・分・秒を設定して使用</div>
      <div class="card-arrow">→</div>
    </a>
  </div>
</body>
</html>
